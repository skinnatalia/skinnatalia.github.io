  <style>
    :root {
      --bg-page: #fbf9f5;
      --bg-surface: #ffffff;
      --bg-cream: #f6f1e6;
      --bg-cream-hover: #efe7d4;
      --gold-primary: #a67c2e;
      --gold-dark: #7d5b1c;
      --gold-light: #d6b87c;
      --gold-border: #d9c396;
      --gold-soft: rgba(166, 124, 46, 0.12);
      --text-main: #231f1a;
      --text-muted: #787064;
      --text-faint: #b3aba0;
      --border-light: #ede6d6;
      --danger: #b83b3b;
      --success: #2c7a52;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 2px 10px rgba(35, 31, 26, 0.04);
      --shadow-fab: 0 8px 22px rgba(166, 124, 46, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 96px;
    }

    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      background: var(--bg-page);
      min-height: 100vh;
      position: relative;
    }

    /* Top Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      gap: 10px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .monogram {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--gold-border);
      background: var(--bg-cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--gold-primary);
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 23px;
      font-weight: 500;
      line-height: 1.05;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22b573;
      box-shadow: 0 0 0 3px rgba(34, 181, 115, 0.15);
      cursor: pointer;
    }

    .sync-dot.cloud {
      background: #2b7de9;
      box-shadow: 0 0 0 3px rgba(43, 125, 233, 0.16);
    }

    .icon-circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--gold-border);
      background: var(--bg-surface);
      color: var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      font-size: 15px;
      transition: background 0.15s ease;
    }

    .icon-circle-btn:hover {
      background: var(--bg-cream);
    }

    .badge-dot {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      display: none;
    }

    .badge-dot.active {
      display: block;
    }
